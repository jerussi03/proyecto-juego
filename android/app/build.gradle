plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ikemen_engine.ikemen_go'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.jerussi.thekingofutc'
        minSdk 34
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets.main {
        assets.srcDirs = ['../../scratch/android-game-assets']
        jniLibs.srcDirs = ['../../scratch/android/native-libs']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
